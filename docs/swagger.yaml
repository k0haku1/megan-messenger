definitions:
  auth.AuthResult:
    properties:
      accessToken:
        type: string
      challengeToken:
        type: string
      needPassword:
        type: boolean
      needUsername:
        type: boolean
      refreshToken:
        type: string
    type: object
  auth.CompleteUsernameResponse:
    properties:
      accessToken:
        type: string
      challengeToken:
        type: string
      needPassword:
        type: boolean
      needUsername:
        type: boolean
      refreshToken:
        type: string
      user:
        additionalProperties: {}
        type: object
    type: object
  auth.RemovePasswordRequest:
    properties:
      currentPassword:
        maxLength: 72
        minLength: 4
        type: string
    required:
    - currentPassword
    type: object
  auth.SetPasswordRequest:
    properties:
      currentPassword:
        type: string
      password:
        maxLength: 72
        minLength: 4
        type: string
    required:
    - password
    type: object
  auth.SetUsernameRequest:
    properties:
      username:
        maxLength: 32
        minLength: 5
        type: string
    required:
    - username
    type: object
  auth.StartPhoneRequest:
    properties:
      phone:
        type: string
    required:
    - phone
    type: object
  auth.Tokens:
    properties:
      accessToken:
        type: string
      refreshToken:
        type: string
    type: object
  auth.VerifyPasswordChallengeRequest:
    properties:
      challengeToken:
        type: string
      password:
        maxLength: 72
        minLength: 4
        type: string
    required:
    - challengeToken
    - password
    type: object
  auth.VerifyPhoneRequest:
    properties:
      code:
        type: string
      phone:
        type: string
    required:
    - code
    - phone
    type: object
  conversation.CreateGroupRequest:
    properties:
      memberIds:
        items:
          type: string
        type: array
      title:
        maxLength: 100
        minLength: 3
        type: string
    required:
    - title
    type: object
  conversation.CreateGroupResponse:
    properties:
      id:
        type: string
      slug:
        type: string
    type: object
  conversation.JoinBySlugResponse:
    properties:
      id:
        type: string
    type: object
  conversation.ListResponse:
    properties:
      conversations:
        items:
          $ref: '#/definitions/model.Conversation'
        type: array
    type: object
  conversation.SendDMMessageRequest:
    properties:
      content:
        maxLength: 5000
        minLength: 1
        type: string
      userId:
        type: string
      username:
        maxLength: 32
        minLength: 5
        type: string
    required:
    - content
    type: object
  conversation.SendDMMessageResponse:
    properties:
      conversation:
        $ref: '#/definitions/model.Conversation'
      message:
        $ref: '#/definitions/model.Message'
    type: object
  httputil.ErrorBody:
    properties:
      code:
        type: string
      fields: {}
      message:
        type: string
    type: object
  httputil.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/httputil.ErrorBody'
    type: object
  message.GetPagingResponse:
    properties:
      messages:
        items:
          $ref: '#/definitions/model.Message'
        type: array
      nextCursor:
        type: string
    type: object
  message.SendMessageRequest:
    properties:
      content:
        maxLength: 5000
        minLength: 1
        type: string
    required:
    - content
    type: object
  message.SendMessageResponse:
    properties:
      message:
        $ref: '#/definitions/model.Message'
    type: object
  model.Conversation:
    properties:
      createdAt:
        type: string
      id:
        type: string
      members:
        items:
          $ref: '#/definitions/model.ConversationMember'
        type: array
      peer:
        $ref: '#/definitions/model.ConversationPeer'
      slug:
        type: string
      title:
        type: string
      type:
        $ref: '#/definitions/model.ConversationType'
    required:
    - id
    - type
    type: object
  model.ConversationMember:
    properties:
      conversationId:
        type: string
      id:
        type: string
      joinedAt:
        type: string
      userId:
        type: string
    required:
    - conversationId
    - id
    - userId
    type: object
  model.ConversationPeer:
    properties:
      avatarUrl:
        type: string
      id:
        type: string
      username:
        type: string
    type: object
  model.ConversationType:
    enum:
    - dm
    - group
    type: string
    x-enum-varnames:
    - ConversationTypeDM
    - ConversationTypeGroup
  model.Message:
    properties:
      content:
        type: string
      conversationId:
        type: string
      createdAt:
        type: string
      id:
        type: string
      sender:
        $ref: '#/definitions/model.MessageSender'
    required:
    - content
    - conversationId
    - createdAt
    - id
    - sender
    type: object
  model.MessageSender:
    properties:
      avatarUrl:
        type: string
      id:
        type: string
      username:
        type: string
    type: object
  user.MeResponse:
    properties:
      avatarUrl:
        type: string
      dmPolicy:
        type: string
      hasPassword:
        type: boolean
      id:
        type: string
      onboardingComplete:
        type: boolean
      phone:
        type: string
      username:
        type: string
      usernameSearchable:
        type: boolean
    type: object
info:
  contact: {}
  title: Megan Messenger API
  version: 1.0.0
paths:
  /auth/logout:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
      summary: Logout a user
      tags:
      - auth
  /auth/onboarding/username:
    post:
      consumes:
      - application/json
      parameters:
      - description: Username
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/auth.SetUsernameRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.CompleteUsernameResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Complete onboarding username
      tags:
      - auth
  /auth/password:
    delete:
      consumes:
      - application/json
      parameters:
      - description: Current password
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/auth.RemovePasswordRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Remove cloud password
      tags:
      - auth
    post:
      consumes:
      - application/json
      parameters:
      - description: Password
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/auth.SetPasswordRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Set or change cloud password
      tags:
      - auth
  /auth/password/verify:
    post:
      consumes:
      - application/json
      parameters:
      - description: Challenge and password
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/auth.VerifyPasswordChallengeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.AuthResult'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
      summary: Verify cloud password challenge
      tags:
      - auth
  /auth/phone/start:
    post:
      consumes:
      - application/json
      parameters:
      - description: Phone
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/auth.StartPhoneRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
      summary: Start phone auth (send OTP)
      tags:
      - auth
  /auth/phone/verify:
    post:
      consumes:
      - application/json
      parameters:
      - description: Phone and code
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/auth.VerifyPhoneRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.AuthResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
      summary: Verify phone OTP
      tags:
      - auth
  /auth/refresh:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.Tokens'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
      summary: Refresh access token
      tags:
      - auth
  /conversations:
    get:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/conversation.ListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List user conversations
      tags:
      - conversation
  /conversations/{conversationID}/messages:
    get:
      parameters:
      - description: Conversation ID
        in: path
        name: conversationID
        required: true
        type: string
      - description: Limit
        in: query
        name: limit
        type: integer
      - description: Cursor
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/message.GetPagingResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List messages in a conversation
      tags:
      - message
    post:
      consumes:
      - application/json
      parameters:
      - description: Conversation ID
        in: path
        name: conversationID
        required: true
        type: string
      - description: Message params
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/message.SendMessageRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/message.SendMessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Send a message in an existing conversation
      tags:
      - message
  /conversations/{conversationID}/ws:
    get:
      description: Connect to receive real-time messages in a conversation
      parameters:
      - description: Conversation ID
        in: path
        name: conversationID
        required: true
        type: string
      responses:
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
      security:
      - WebSocketQueryAuth: []
      summary: Connect to conversation websocket
      tags:
      - conversation
  /conversations/dm/messages:
    post:
      consumes:
      - application/json
      description: Creates the DM conversation if it does not exist yet
      parameters:
      - description: DM message params
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/conversation.SendDMMessageRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/conversation.SendDMMessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Send the first message in a direct conversation
      tags:
      - conversation
  /conversations/group:
    post:
      consumes:
      - application/json
      parameters:
      - description: Group creation params
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/conversation.CreateGroupRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/conversation.CreateGroupResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a group conversation
      tags:
      - conversation
  /conversations/join/{slug}:
    post:
      parameters:
      - description: Invite slug
        in: path
        name: slug
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/conversation.JoinBySlugResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Join a group conversation by invite slug
      tags:
      - conversation
  /users/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.MeResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get current user
      tags:
      - user
  /users/me/avatar:
    post:
      consumes:
      - multipart/form-data
      parameters:
      - description: Avatar file
        in: formData
        name: avatar
        required: true
        type: file
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Upload user avatar
      tags:
      - user
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
