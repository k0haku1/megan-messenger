definitions:
  auth.LoginCredentials:
    properties:
      login:
        maxLength: 255
        minLength: 3
        type: string
      password:
        maxLength: 72
        minLength: 6
        type: string
    required:
    - login
    - password
    type: object
  auth.RegisterCredentials:
    properties:
      confirmPassword:
        maxLength: 72
        minLength: 6
        type: string
      email:
        maxLength: 255
        type: string
      password:
        maxLength: 72
        minLength: 6
        type: string
      username:
        maxLength: 32
        minLength: 3
        type: string
    required:
    - confirmPassword
    - email
    - password
    - username
    type: object
  auth.ResendVerificationCodeRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  auth.Tokens:
    properties:
      accessToken:
        type: string
      refreshToken:
        type: string
    required:
    - accessToken
    - refreshToken
    type: object
  auth.VerifyEmailRequest:
    properties:
      code:
        type: string
      email:
        type: string
    required:
    - code
    - email
    type: object
  conversation.CreateDMRequest:
    properties:
      userId:
        type: string
    required:
    - userId
    type: object
  conversation.CreateGroupRequest:
    properties:
      memberIds:
        items:
          type: string
        type: array
      title:
        maxLength: 100
        minLength: 3
        type: string
    required:
    - title
    type: object
  conversation.CreateGroupResponse:
    properties:
      id:
        type: string
      slug:
        type: string
    type: object
  conversation.JoinBySlugResponse:
    properties:
      id:
        type: string
    type: object
  conversation.ListResponse:
    properties:
      conversations:
        items:
          $ref: '#/definitions/model.Conversation'
        type: array
    type: object
  httputil.ErrorBody:
    properties:
      code:
        type: string
      fields: {}
      message:
        type: string
    type: object
  httputil.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/httputil.ErrorBody'
    type: object
  message.GetPagingResponse:
    properties:
      messages:
        items:
          $ref: '#/definitions/model.Message'
        type: array
      nextCursor:
        type: string
    type: object
  model.Conversation:
    properties:
      createdAt:
        type: string
      id:
        type: string
      members:
        items:
          $ref: '#/definitions/model.ConversationMember'
        type: array
      slug:
        type: string
      title:
        type: string
      type:
        $ref: '#/definitions/model.ConversationType'
    required:
    - id
    - type
    type: object
  model.ConversationMember:
    properties:
      conversationId:
        type: string
      id:
        type: string
      joinedAt:
        type: string
      userId:
        type: string
    required:
    - conversationId
    - id
    - userId
    type: object
  model.ConversationType:
    enum:
    - dm
    - group
    type: string
    x-enum-varnames:
    - ConversationTypeDM
    - ConversationTypeGroup
  model.Message:
    properties:
      content:
        type: string
      conversationId:
        type: string
      createdAt:
        type: string
      id:
        type: string
      sender:
        $ref: '#/definitions/model.MessageSender'
    required:
    - content
    - conversationId
    - createdAt
    - id
    - sender
    type: object
  model.MessageSender:
    properties:
      avatarUrl:
        type: string
      id:
        type: string
      username:
        type: string
    type: object
  model.User:
    properties:
      avatarUrl:
        type: string
      email:
        type: string
      emailVerified:
        type: boolean
      id:
        type: string
      username:
        type: string
    required:
    - email
    - emailVerified
    - id
    - username
    type: object
  user.UpdateEmailRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  user.UpdatePasswordRequest:
    properties:
      currentPassword:
        minLength: 6
        type: string
      newPassword:
        minLength: 6
        type: string
    required:
    - currentPassword
    - newPassword
    type: object
info:
  contact: {}
  title: Megan Messenger API
  version: 1.0.0
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Login credentials
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/auth.LoginCredentials'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.Tokens'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
      summary: Login a user
      tags:
      - auth
  /auth/logout:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
      summary: Logout a user
      tags:
      - auth
  /auth/refresh:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.Tokens'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
      summary: Refresh access token
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: Registration credentials
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/auth.RegisterCredentials'
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
      summary: Register a new user
      tags:
      - auth
  /auth/verify:
    post:
      consumes:
      - application/json
      parameters:
      - description: Verification credentials
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/auth.VerifyEmailRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
      summary: Verify email
      tags:
      - auth
  /auth/verify/resend:
    post:
      consumes:
      - application/json
      parameters:
      - description: Email
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/auth.ResendVerificationCodeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
      summary: Resend verification code
      tags:
      - auth
  /conversations:
    get:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/conversation.ListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List user conversations
      tags:
      - conversation
  /conversations/{conversationID}/messages:
    get:
      parameters:
      - description: Conversation ID
        in: path
        name: conversationID
        required: true
        type: string
      - description: Limit
        in: query
        name: limit
        type: integer
      - description: Cursor
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/message.GetPagingResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List messages in a conversation
      tags:
      - message
  /conversations/{conversationID}/ws:
    get:
      description: Connect to receive real-time messages in a conversation
      parameters:
      - description: Conversation ID
        in: path
        name: conversationID
        required: true
        type: string
      responses:
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
      security:
      - WebSocketQueryAuth: []
      summary: Connect to conversation websocket
      tags:
      - conversation
  /conversations/dm:
    post:
      consumes:
      - application/json
      parameters:
      - description: DM params
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/conversation.CreateDMRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Conversation'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create or get a direct message conversation
      tags:
      - conversation
  /conversations/group:
    post:
      consumes:
      - application/json
      parameters:
      - description: Group creation params
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/conversation.CreateGroupRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/conversation.CreateGroupResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a group conversation
      tags:
      - conversation
  /conversations/join/{slug}:
    post:
      parameters:
      - description: Invite slug
        in: path
        name: slug
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/conversation.JoinBySlugResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Join a group conversation by invite slug
      tags:
      - conversation
  /users/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.User'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get current user
      tags:
      - user
  /users/me/avatar:
    post:
      consumes:
      - multipart/form-data
      parameters:
      - description: Avatar file
        in: formData
        name: avatar
        required: true
        type: file
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Upload user avatar
      tags:
      - user
  /users/me/email:
    put:
      consumes:
      - application/json
      parameters:
      - description: Email update request
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/user.UpdateEmailRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update user email
      tags:
      - user
  /users/me/password:
    put:
      consumes:
      - application/json
      parameters:
      - description: Password change request
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/user.UpdatePasswordRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Change user password
      tags:
      - user
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
